<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Treino Pesado Academia | São Mateus do Maranhão</title>

    <!-- 1. META DESCRIPTION (Resolve o erro do Lighthouse) -->
    <meta 
      name="description" 
      content="Treino Pesado Academia em São Mateus do Maranhão. Estrutura completa, equipamentos modernos, fichas 100% digitais no app e mensalidade por apenas R$ 80." 
    />

    <!-- 2. OPEN GRAPH (Otimização para partilha no WhatsApp e Redes Sociais) -->
    <meta property="og:title" content="Treino Pesado Academia | São Mateus do Maranhão" />
    <meta property="og:description" content="Estrutura completa, galera que treina sério e preço que cabe no bolso. Mensalidade por apenas R$ 80." />
    <meta property="og:image" content="/assets/img/logo-treino-pesado-icon.png" />
    <meta property="og:type" content="website" />

    <!-- 3. DECLARAÇÃO DO FAVICON -->
    <link rel="icon" type="image/png" href="/assets/img/logo-treino-pesado-icon.png" />

    <!-- 4. Conexão antecipada com os servidores do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 5. MODULEPRELOAD: Carregamento do JS principal em paralelo -->
    <link rel="modulepreload" href="/src/main.js" />

    <!-- 6. PRELOAD RESPONSIVO DA IMAGEM LCP -->
    <link
      rel="preload"
      as="image"
      href="/assets/img/fotoacademia1-mobile.webp"
      type="image/webp"
      media="(max-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/img/fotoacademia1.webp"
      type="image/webp"
      media="(min-width: 769px)"
      fetchpriority="high"
    />

    <!-- 7. CARREGAMENTO ASSÍNCRONO DAS FONTES -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />

    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
        rel="stylesheet"
      />
      <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body
    class="bg-brand-dark text-[#e5e1e4] antialiased selection:bg-brand-primary selection:text-primary"
  >
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
